name: Enterprise Platform Delivery

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: 1.12.2
  TERRAFORM_WORKING_DIRECTORY: terraform/environments/dev
  ANSIBLE_INVENTORY: ansible/inventories/dev/aws_ec2.yml
  ANSIBLE_PLAYBOOK: ansible/playbooks/configure_application.yml
  AWS_ROLE_ARN: arn:aws:iam::874456855495:role/eapdp-dev-github-actions-role

jobs:
  terraform-check:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialise Terraform
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Validate Terraform
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Create Terraform plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=github-actions.tfplan

      - name: Write Terraform summary
        if: always()
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: |
          {
            echo "## Terraform"
            echo
            echo "- Formatting checked"
            echo "- Configuration validated"
            echo "- Infrastructure plan generated"
            echo "- No automatic Terraform apply performed"
          } >> "$GITHUB_STEP_SUMMARY"

  ansible-deploy:
    name: Ansible Rolling Deployment
    runs-on: ubuntu-latest
    needs:
      - terraform-check

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-ansible
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ansible-core \
            boto3 \
            botocore

      - name: Install Amazon AWS collection
        run: |
          ansible-galaxy collection install amazon.aws

      - name: Install AWS Session Manager plugin
        run: |
          curl \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb

          session-manager-plugin --version

      - name: Display Ansible version
        run: ansible --version

      - name: Test dynamic inventory
        run: |
          ansible-inventory \
            -i "${ANSIBLE_INVENTORY}" \
            --graph

      - name: Test SSM connectivity
        run: |
          ansible \
            tier_application \
            -i "${ANSIBLE_INVENTORY}" \
            -m ping

      - name: Run rolling application deployment
        run: |
          ansible-playbook \
            -i "${ANSIBLE_INVENTORY}" \
            "${ANSIBLE_PLAYBOOK}"

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Ansible deployment"
            echo
            echo "- Environment: dev"
            echo "- Region: ${AWS_REGION}"
            echo "- Inventory: ${ANSIBLE_INVENTORY}"
            echo "- Playbook: ${ANSIBLE_PLAYBOOK}"
            echo "- Connection method: AWS Systems Manager"
            echo "- Deployment strategy: rolling deployment"
          } >> "$GITHUB_STEP_SUMMARY"
